version: '3.8'
services:
  node1:
    build:
      context: ./node
      dockerfile: Dockerfile
    container_name: raft-node1
    environment:
      - RAFT_NODE_ID=node1
      - RAFT_PEERS=http://node2:8080,http://node3:8080
      - RAFT_ELECTION_TIMEOUT_MIN_MS=1200
      - RAFT_ELECTION_TIMEOUT_MAX_MS=3000
      - RAFT_HEARTBEAT_INTERVAL_MS=200
      - RAFT_DATA_DIR=/data
#    volumes:
#      - node1_data:/data
    networks:
      - raft-net
    ports:
      - "8081:8080"
    restart: unless-stopped

  node2:
    build:
      context: ./node
      dockerfile: Dockerfile
    container_name: raft-node2
    environment:
      - RAFT_NODE_ID=node2
      - RAFT_PEERS=http://node1:8080,http://node3:8080
      - RAFT_ELECTION_TIMEOUT_MIN_MS=1200
      - RAFT_ELECTION_TIMEOUT_MAX_MS=3000
      - RAFT_HEARTBEAT_INTERVAL_MS=200
      - RAFT_DATA_DIR=/data
#    volumes:
#      - node2_data:/data
    networks:
      - raft-net
    ports:
      - "8082:8080"
    restart: unless-stopped

  node3:
    build:
      context: ./node
      dockerfile: Dockerfile
    container_name: raft-node3
    environment:
      - RAFT_NODE_ID=node3
      - RAFT_PEERS=http://node1:8080,http://node2:8080
      - RAFT_ELECTION_TIMEOUT_MIN_MS=1200
      - RAFT_ELECTION_TIMEOUT_MAX_MS=3000
      - RAFT_HEARTBEAT_INTERVAL_MS=200
      - RAFT_DATA_DIR=/data
#    volumes:
#      - node3_data:/data
    networks:
      - raft-net
    ports:
      - "8083:8080"
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: raft-client
    environment:
      - NODE_URLS=http://node1:8080,http://node2:8080,http://node3:8080
    networks:
      - raft-net
    depends_on:
      - node1
      - node2
      - node3
    restart: on-failure

networks:
  raft-net:
    driver: bridge

